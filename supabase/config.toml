project_id = "yqzlekflztbuyuzwmnip"

# Las funciones del login del alumno se llaman sin sesión (el chico aún no está
# logueado); la auth la hacen ellas (secreto de aula + PIN + lockout).
[functions.aula-students]
verify_jwt = false

[functions.alumno-login]
verify_jwt = false

# SOL (Fase 2): endurecida — verifica JWT y además chequea getUser adentro.
# (Antes verify_jwt=false la dejaba abierta como vector de costo Claude.)
[functions.sol]
verify_jwt = true

# Autoría docente (Fase 2 / SP-2): la llama la seño logueada; tomamos su identidad
# del JWT, así que SÍ se verifica.
[functions.dividir-nodos]
verify_jwt = true

# Evaluador por sesión (Fase 2 / SP-4c): lo llama el alumno logueado para SU sesión.
[functions.evaluar-sesion]
verify_jwt = true

# Generador de ejercicios (Fase 2 / T6): pool inicial (docente) y reposición
# (docente o alumno); en ambos casos tomamos la identidad del JWT.
[functions.generador-ejercicios]
verify_jwt = true

# LUNA (Fase 2): copiloto de la docente. Las llama la seño logueada; identidad
# del JWT + re-chequeo de rol docente y pertenencia del alumno adentro.
[functions.luna-boletin]
verify_jwt = true

[functions.luna-chat]
verify_jwt = true

# Dashboard admin v3 (ADR-009): todas las fns admin-* exigen JWT y re-chequean
# adentro la fila activa en plataforma_admin (guard _shared/admin.ts). El front
# les pega con el access token del admin (web/lib/admin/api.ts).
[functions.admin-colegios]
verify_jwt = true

[functions.admin-maestras]
verify_jwt = true

[functions.admin-accesos]
verify_jwt = true

[functions.admin-features]
verify_jwt = true

[functions.admin-metricas]
verify_jwt = true

[functions.admin-costos]
verify_jwt = true

[functions.admin-crm]
verify_jwt = true

[functions.admin-anuncios]
verify_jwt = true

[functions.admin-auditoria]
verify_jwt = true

[functions.admin-plataforma]
verify_jwt = true

[functions.admin-impersonar]
verify_jwt = true

# Fase Observatorio y avisos (ADR-010). admin-jobs tiene guard DUAL adentro:
# el cron de pg_net manda el service key como Bearer (verify_jwt lo acepta
# porque el service key ES un JWT); un admin humano pasa por verificarAdmin.
[functions.admin-jobs]
verify_jwt = true

[functions.admin-observatorio]
verify_jwt = true
